# JAM Trail 시험 필드(testfield/)를 빌드합니다.
#
# 산출물
#   JAMTEST-iq      : Connect IQ 스토어 업로드용 패키지 (JAMTEST.iq). 개발자 키 비밀값이 있을 때만 만듭니다.
#   JAMTEST-prg     : 기기별 .prg (확인용)
#
# 준비
#   저장소 Settings → Secrets and variables → Actions → New repository secret
#   이름: CIQ_DEVELOPER_KEY_B64
#   값  : .pem 키 파일의 내용 그대로, 또는 .der 키 파일을 Base64로 바꾼 한 줄 문자열
#   스토어 앱은 처음 업로드한 키로만 업데이트할 수 있으므로 항상 같은 키를 씁니다.
#
# SDK는 Garmin 공식 주소에서 받습니다. 기기 파일(fēnix 8 43mm, 47/51mm)은 공개 저장소
# mgallesio/granbike-face-builder에 있는 사본을 씁니다. SDK와 기기 파일은
# Connect IQ Developer Agreement를 따르며 앱 개발·시험 목적으로만 씁니다.
name: Build test field

on:
  push:
    paths:
      - "testfield/**"
      - ".github/workflows/build-testfield.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SDK_FALLBACK: connectiq-sdk-lin-8.2.1-2025-06-19-f69b94140
  DEVICES_REPO: https://github.com/mgallesio/granbike-face-builder.git
  DEVICES_REF: 4dff743377cde3c09c9204d3c948d8076129b433
  DEVICES: fenix843mm fenix847mm

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Connect IQ SDK 받기 (최신)
        run: |
          set -e
          LATEST=$(curl -fsSL --retry 2 https://developer.garmin.com/downloads/connect-iq/sdks/sdks.json \
            | grep -o 'connectiq-sdk-lin-[0-9][0-9.]*-[0-9-]*-[0-9a-f]*\.zip' | sort -uV | tail -1 || true)
          SDK_ZIP=${LATEST:-${SDK_FALLBACK}.zip}
          echo "SDK: $SDK_ZIP"
          curl -fsSL --retry 2 -o sdk.zip "https://developer.garmin.com/downloads/connect-iq/sdks/${SDK_ZIP}"
          unzip -q sdk.zip -d "$HOME/ciq-sdk"
          MONKEYC=$(find "$HOME/ciq-sdk" -path "*/bin/monkeyc" | head -1)
          test -n "$MONKEYC"
          chmod +x "$MONKEYC"
          echo "MONKEYC=$MONKEYC" >> "$GITHUB_ENV"
          "$MONKEYC" --version || true

      - name: 기기 파일 받기
        run: |
          set -e
          rm -rf dev && git init -q dev && cd dev
          git remote add origin "$DEVICES_REPO"
          git sparse-checkout init --cone
          git sparse-checkout set $(for d in $DEVICES; do printf 'backend/devices/%s ' "$d"; done)
          git fetch -q --depth 1 --filter=blob:none origin "$DEVICES_REF"
          git checkout -q FETCH_HEAD
          cd ..
          mkdir -p "$HOME/.Garmin/ConnectIQ/Devices"
          for d in $DEVICES; do
            cp -r "dev/backend/devices/$d" "$HOME/.Garmin/ConnectIQ/Devices/"
            echo "$d: $(ls "$HOME/.Garmin/ConnectIQ/Devices/$d" | wc -l) files"
          done

      - name: 개발자 키 준비
        env:
          KEY_B64: ${{ secrets.CIQ_DEVELOPER_KEY_B64 }}
        run: |
          set -e
          if [ -n "$KEY_B64" ]; then
            if printf '%s' "$KEY_B64" | grep -q "BEGIN"; then
              # .pem 파일 내용을 그대로 붙여 넣은 경우
              printf '%s\n' "$KEY_B64" > "$RUNNER_TEMP/key.raw"
            else
              # .der 파일을 Base64로 바꿔 붙여 넣은 경우
              echo "$KEY_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/key.raw"
            fi
            if grep -q "BEGIN" "$RUNNER_TEMP/key.raw"; then
              # PEM이면 DER(PKCS#8)로 바꿉니다
              openssl pkcs8 -topk8 -inform PEM -outform DER -in "$RUNNER_TEMP/key.raw" -out "$RUNNER_TEMP/key.der" -nocrypt
            else
              mv "$RUNNER_TEMP/key.raw" "$RUNNER_TEMP/key.der"
            fi
            rm -f "$RUNNER_TEMP/key.raw"
            echo "KEY_KIND=secret" >> "$GITHUB_ENV"
            echo "저장소 비밀값의 개발자 키를 씁니다."
          else
            openssl genrsa -out "$RUNNER_TEMP/key.pem" 4096 2>/dev/null
            openssl pkcs8 -topk8 -inform PEM -outform DER -in "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/key.der" -nocrypt
            echo "KEY_KIND=temp" >> "$GITHUB_ENV"
            echo "::warning::CIQ_DEVELOPER_KEY_B64 비밀값이 없어 임시 키로 빌드합니다. 스토어용 .iq는 만들지 않습니다."
          fi

      - name: 기기별 빌드 (.prg)
        run: |
          set -e
          mkdir -p out
          for d in $DEVICES; do
            "$MONKEYC" -f testfield/monkey.jungle -d "$d" -y "$RUNNER_TEMP/key.der" -o "out/JAMTEST-$d.prg" -w -l 1
          done

      # 임시 키일 때도 패키지가 만들어지는지만 확인하고, 산출물로는 올리지 않습니다.
      - name: 스토어용 패키지 (.iq)
        run: |
          set -e
          "$MONKEYC" -e -r -f testfield/monkey.jungle -y "$RUNNER_TEMP/key.der" -o out/JAMTEST.iq -w -l 1
          ls -la out
          if [ "$KEY_KIND" != "secret" ]; then rm -f out/JAMTEST.iq; echo "임시 키 패키지는 지웠습니다."; fi

      - name: 키 파일 지우기
        if: always()
        run: rm -f "$RUNNER_TEMP/key.der" "$RUNNER_TEMP/key.pem"

      - uses: actions/upload-artifact@v4
        with:
          name: JAMTEST-prg
          path: out/*.prg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: env.KEY_KIND == 'secret'
        with:
          name: JAMTEST-iq
          path: out/JAMTEST.iq
          if-no-files-found: error
