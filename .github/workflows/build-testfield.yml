# JAM Trail 시험 필드(testfield/)를 빌드해 .prg 파일을 Actions 산출물로 올립니다.
#
# - SDK: Garmin 공식 주소에서 받습니다. 실패하면 openhab-garmin 저장소에 공개된 같은 버전 사본을 씁니다.
# - 기기 파일: fēnix 8 47/51mm(fenix847mm)는 openhab-garmin 저장소에 공개된 사본을 씁니다.
#   Connect IQ SDK와 기기 파일은 Connect IQ Developer Agreement를 따르며, 앱 개발·시험 목적으로만 씁니다.
# - 개발자 키: 빌드할 때마다 임시로 만듭니다(사이드로드 시험용).
name: Build test field

on:
  push:
    paths:
      - "testfield/**"
      - ".github/workflows/build-testfield.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SDK_NAME: connectiq-sdk-lin-8.2.1-2025-06-19-f69b94140
  OPENHAB_REF: 86ba367144839b5501008d3a96f1042393f9e431
  DEVICE: fenix847mm

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Connect IQ SDK 받기
        run: |
          set -e
          mkdir -p "$HOME/ciq"
          if curl -fsSL --retry 2 -o sdk.zip "https://developer.garmin.com/downloads/connect-iq/sdks/${SDK_NAME}.zip" && unzip -tq sdk.zip >/dev/null; then
            echo "Garmin 공식 주소에서 SDK를 받았습니다."
            unzip -q sdk.zip -d "$HOME/ciq/sdk"
          else
            echo "::warning::Garmin 주소에서 SDK를 받지 못해 openhab-garmin의 사본을 씁니다."
            git init -q oh && cd oh
            git remote add origin https://github.com/openhab/openhab-garmin.git
            git sparse-checkout init --cone
            git sparse-checkout set ".github/ConnectIQ/Sdks/${SDK_NAME}"
            git fetch -q --depth 1 --filter=blob:none origin "$OPENHAB_REF"
            git checkout -q FETCH_HEAD
            cd ..
            cp -r "oh/.github/ConnectIQ/Sdks/${SDK_NAME}" "$HOME/ciq/sdk"
          fi
          # zip 안에 최상위 폴더가 하나 더 있는 경우를 처리
          MONKEYC=$(find "$HOME/ciq/sdk" -path "*/bin/monkeyc" | head -1)
          test -n "$MONKEYC"
          chmod +x "$MONKEYC"
          echo "MONKEYC=$MONKEYC" >> "$GITHUB_ENV"
          "$MONKEYC" --version || true

      - name: 기기 파일 받기 (${{ env.DEVICE }})
        run: |
          set -e
          rm -rf dev && git init -q dev && cd dev
          git remote add origin https://github.com/openhab/openhab-garmin.git
          git sparse-checkout init --cone
          git sparse-checkout set ".github/ConnectIQ/Devices/${DEVICE}"
          git fetch -q --depth 1 --filter=blob:none origin "$OPENHAB_REF"
          git checkout -q FETCH_HEAD
          cd ..
          mkdir -p "$HOME/.Garmin/ConnectIQ/Devices"
          cp -r "dev/.github/ConnectIQ/Devices/${DEVICE}" "$HOME/.Garmin/ConnectIQ/Devices/"
          ls "$HOME/.Garmin/ConnectIQ/Devices/${DEVICE}" | head

      - name: 임시 개발자 키 만들기
        run: |
          openssl genrsa -out "$RUNNER_TEMP/key.pem" 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER -in "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/key.der" -nocrypt

      - name: 빌드
        run: |
          mkdir -p out
          "$MONKEYC" -f testfield/monkey.jungle -d "$DEVICE" -y "$RUNNER_TEMP/key.der" -o out/JAMTEST.prg -w -l 1

      - uses: actions/upload-artifact@v4
        with:
          name: JAMTEST-${{ env.DEVICE }}
          path: out/JAMTEST.prg
          if-no-files-found: error
